name: React CI

on:
  push:
    branches: [ master ]   # since you only have master
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # opt into Node.js 24 now
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # latest version

      - name: Setup Node.js
        uses: actions/setup-node@v4 # latest version
        with:
          node-version: '20'        # or '18' if your project requires it
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build project
        run: npm run build
