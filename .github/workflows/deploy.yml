name: React CI

on:
  push:
    branches: [ master ]   # since you only have master
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # upgrade from v3

      - name: Setup Node.js
        uses: actions/setup-node@v4 # upgrade from v3
        with:
          node-version: '20'        # or '20' if your project requires it
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build project
        run: npm run build
